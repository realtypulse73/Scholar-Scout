name: ScholarScout Prelaunch Rehearsal

on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: Full SHA of an open pull request to main
        required: true
        type: string

permissions:
  contents: read
  actions: read
  deployments: read
  pull-requests: read

concurrency:
  group: scholarscout-prelaunch-rehearsal
  cancel-in-progress: true

jobs:
  rehearsal:
    name: Prelaunch rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SCHOLARSCOUT_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
      SCHOLARSCOUT_E2E_FIXTURE_CAPABILITY: ${{ secrets.SCHOLARSCOUT_REHEARSAL_BASELINE_CAPABILITY }}
      SCHOLARSCOUT_E2E_OUTAGE_FIXTURE_CAPABILITY: ${{ secrets.SCHOLARSCOUT_REHEARSAL_OUTAGE_CAPABILITY }}
      SCHOLARSCOUT_GITHUB_DEPLOYMENTS_TOKEN: ${{ github.token }}
      SCHOLARSCOUT_REHEARSAL_BASELINE_HOST_PREFIX: ${{ vars.SCHOLARSCOUT_REHEARSAL_BASELINE_HOST_PREFIX }}
      SCHOLARSCOUT_REHEARSAL_OUTAGE_HOST_PREFIX: ${{ vars.SCHOLARSCOUT_REHEARSAL_OUTAGE_HOST_PREFIX }}
    steps:
      - name: Require an open candidate pull request to main
        uses: actions/github-script@v7
        with:
          script: |
            const candidate = process.env.SCHOLARSCOUT_CANDIDATE_COMMIT;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'main',
              per_page: 100,
            });
            if (!pulls.some((pull) => pull.head.sha === candidate)) {
              core.setFailed('The candidate commit must be the current head of an open pull request to main.');
            }

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_commit }}

      - name: Verify candidate checkout
        run: test "$(git rev-parse HEAD)" = "${{ inputs.candidate_commit }}"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install without postinstall scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Wait for the two isolated rehearsal deployments
        run: |
          for attempt in $(seq 1 40); do
            if node scripts/discover-rehearsal-preview-deployments.mjs \
              --owner "${{ github.repository_owner }}" \
              --repo "${{ github.event.repository.name }}" \
              --candidate-commit "${{ inputs.candidate_commit }}" \
              --baseline-host-prefix "$SCHOLARSCOUT_REHEARSAL_BASELINE_HOST_PREFIX" \
              --outage-host-prefix "$SCHOLARSCOUT_REHEARSAL_OUTAGE_HOST_PREFIX" \
              --output reports/prelaunch-rehearsal/discovered-previews.json \
              --github-env "$GITHUB_ENV"; then
              exit 0
            fi
            sleep 15
          done
          exit 1

      - name: Install Chromium for browser proof
        run: pnpm exec playwright install --with-deps chromium

      - name: Run candidate quality, high-risk, and local browser proof
        run: pnpm run rehearse:prelaunch -- --release-gate --local-only --candidate-commit "${{ inputs.candidate_commit }}"

      - name: Baseline rehearsal
        run: node scripts/run-preview-release-tracer.mjs --output reports/prelaunch-rehearsal/preview-browser.json

      - name: Outage rehearsal and restoration proof
        run: node scripts/run-preview-outage-rehearsal.mjs --output reports/prelaunch-rehearsal/preview-outage.json

      - name: Aggregate candidate release rehearsal
        run: |
          pnpm run rehearse:prelaunch -- --release-gate --aggregate-only --candidate-commit "${{ inputs.candidate_commit }}" --preview-browser-record reports/prelaunch-rehearsal/preview-browser.json --preview-outage-record reports/prelaunch-rehearsal/preview-outage.json
          test -f reports/prelaunch-rehearsal/release-records.json

      - name: Summarize prelaunch rehearsal
        if: always()
        run: cat reports/prelaunch-rehearsal/prelaunch-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload prelaunch rehearsal artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prelaunch-rehearsal
          path: reports/prelaunch-rehearsal
          retention-days: 14
